[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airfare-price-index"
version = "0.1.0"
description = "CPI-style daily price index for Indian domestic airfares"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
scrape = ["playwright>=1.40"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
airfare = "airfare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airfare = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
